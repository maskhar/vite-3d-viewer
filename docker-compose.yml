version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3008:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: 3d-model-catalog
    networks:
      - carubra-network

networks:
  carubra-network:
    external: true
